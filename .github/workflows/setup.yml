# Proves tools/cloud-setup.sh actually provisions a fresh Linux machine, which
# is the one thing no amount of reading can establish. The runner is a genuine
# cold start: no sibling game repo, no projects.json, no node_modules — so the
# clone branch that a re-run on a developer machine always skips is exercised
# here every time.
name: setup

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cloud-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 20 is the README's floor and what the preflight enforces. Pinning the
      # major here means a bump to that floor has to be made in both places
      # deliberately, rather than CI silently drifting onto whatever is newest.
      #
      # Unrelated to the @v5 above: that is the runtime the action itself runs
      # on, which GitHub moved off Node 20. This node-version is the toolchain
      # the panel is built with, and stays at the README's floor.
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: shellcheck
        # Every shell script in tools/, not just the new one. up.sh predates any
        # linting, so this is the run that finds out whether it was clean by
        # accident or by construction.
        run: shellcheck tools/*.sh

      # Clones the sibling game repo, writes projects.json, runs npm ci.
      - name: provision
        run: tools/cloud-setup.sh

      - name: verify the layout the factory expects
        run: |
          test -d ../ghost-in-the-wreck || { echo "sibling game repo missing"; exit 1; }
          test -f projects.json         || { echo "projects.json missing"; exit 1; }

      # The claim the docs have been carrying unverified since day one.
      # No ANTHROPIC_API_KEY is set: the panel must build without it, and only
      # RUN LLM STEP may fail at runtime for want of it.
      - name: build the panel
        run: npm run build
